<!DOCTYPE html>
    <html><head><meta charset="UTF-8">
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .settore-verde { border: 3px solid #00ff88; background: #0a0a0a; padding: 20px; border-radius: 15px; margin-bottom: 30px; }
        .settore-oro { border: 3px solid gold; background: #0a0a0a; padding: 20px; border-radius: 15px; }
        .flex { display: flex; justify-content: center; gap: 20px; align-items: center; margin-top: 20px; }
        .gold-select { color: gold; border: 2px solid gold; padding: 15px; background: #1a1a1a; cursor: pointer; margin: 5px; }
        .img-left { width: 30%; border: 2px solid gold; }
        .img-right { width: 60%; border: 2px solid gold; }
    </style></head>
    <body>
        <div class="settore-verde">

                <option value="">-- 📜 ALBO D'ORO --</option>
                <option value="immagini_fisse/ALBOTORNEO.png">ALBO TORNEO</option>

            </select><br><img id="i-albo" style="display:none; width:400px; margin-top:10px;">

                <option value="">-- 📜 REGOLAMENTI --</option><option value="immagini_fisse/Pronosticare 1-RISULTATO ESATTO.jpg">Pronosticare 1-RISULTATO ESATTO</option><option value="immagini_fisse/Pronosticare 2-COL.BONUS.jpg">Pronosticare 2-COL.BONUS</option><option value="immagini_fisse/Pronosticare 3-PARTITE + - GOL.jpg">Pronosticare 3-PARTITE + - GOL</option><option value="immagini_fisse/Pronosticare 4-PARTITA JOLLY.jpg">Pronosticare 4-PARTITA JOLLY</option><option value="immagini_fisse/punti EXTRA 1- con SEGNI 1X2.jpg">punti EXTRA 1- con SEGNI 1X2</option><option value="immagini_fisse/punti EXTRA 2-con COL.BONUS.jpg">punti EXTRA 2-con COL.BONUS</option><option value="immagini_fisse/punti EXTRA 3-con SOMMAGOL SQUADRE.jpg">punti EXTRA 3-con SOMMAGOL SQUADRE</option><option value="immagini_fisse/punti EXTRA 4-con PARTITA + DIFFICILE.jpg">punti EXTRA 4-con PARTITA + DIFFICILE</option><option value="immagini_fisse/punti EXTRA 5-con COPPIA + - GOL.jpg">punti EXTRA 5-con COPPIA + - GOL</option><option value="immagini_fisse/punti EXTRA 6-con JOLLY TURNO.jpg">punti EXTRA 6-con JOLLY TURNO</option><option value="immagini_fisse/vincita EXTRA con JACKPOT.jpg">vincita EXTRA con JACKPOT</option>
            </select><br><img id="i-reg" style="display:none; width:400px; margin-top:10px;">
            <div class="flex">
                <img src="foto_tabellini/risultati_partite.png?v=1783404648" style="width:50%; border:2px solid #00ff88;">
                <img src="foto_tabellini/foto_extra.png?v=1783404648" style="width:25%; border:1px solid #444;">
            </div>
        </div>
        <div class="settore-oro">
            <h1 style="color: gold; font-size: 40px;">🏆 2° Coppa SHECTOR 🏆</h1>
            <select class="gold-select" onchange="document.getElementById('c-img').src=this.value">
                <option>-- REGOLAMENTO FASI --</option><option value="immagini_fisse/fase A.jpg">Fase A</option><option value="immagini_fisse/fase B.jpg">Fase B</option><option value="immagini_fisse/fase C.jpg">Fase C</option>
            </select><br><img id="c-img" style="width:300px; margin-top:10px;">
            <div class="flex"><img src="foto_tabellini/coppa_fase1_parte1.png?v=1783404648" class="img-left"><img src="foto_tabellini/coppa_fase1_parte2.png?v=1783404648" class="img-right"></div>
