    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
    .modal-container { position: relative; margin: auto; width: max-content; max-width: 97%; max-height: 97vh; margin-top: 1%; text-align: right; }
    .modal-content { display: block; max-width: 100%; max-height: 91vh; border: 3px solid #00ff88; }
    .close-btn-extern { display: inline-block; margin-top: 8px; background-color: #00ff88; color: #121212; font-family: "AR CENA", sans-serif; font-size: 24px; font-weight: bold; padding: 6px 25px; border-radius: 6px; cursor: pointer; text-transform: uppercase; border: 2px solid #fff; }
    .close-btn-extern:hover { background-color: #00cc6a; }
    .settore-verde { border: 3px solid #00ff88; background: #0a0a0a; padding: 20px; border-radius: 15px; margin-bottom: 30px; }

    .settore-blu { border: 3px solid #00bfff; background: #0a0a0a; padding: 20px; border-radius: 15px; margin-bottom: 30px; }
    .frame { border: 2px solid #00ff88; padding: 15px; margin: 20px auto; width: 95%; border-radius: 10px; }
    .flex-tab-class { display: flex; gap: 20px; justify-content: center; align-items: flex-start; margin-top: 20px; }
    .col-classifica-p1 { width: 50%; }

    .img-larga { width: 98%; border: 2px solid #00ff88; display: block; margin: 0 auto; }
    .img-classifica-ridotta { width: 85%; border: 2px solid #00ff88; display: block; margin: 0 auto; }
    .img-extra { width: 72%; border: 1px solid #444; margin-top: 20px; display: block; margin: 0 auto; }
    .coppa-img { width: 45%; border: 2px solid gold; vertical-align: top; }

<script>

    function gestisciSelezione(valore) {

        if (valore.includes("I PRONOSTICI DI TUTTI.png")) {
            modal.style.display = "block";
            modalImg.src = valore;
            img.style.display = "none";
        } else if (valore !== "") {
            modal.style.display = "none";
            img.src = valore;
            img.style.display = "inline";
        } else {
            img.style.display = "none";
        }
    }
