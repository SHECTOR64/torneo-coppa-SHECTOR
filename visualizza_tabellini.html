<!DOCTYPE html>
    <html lang="it">
    <head>
        <meta charset="UTF-8">
        <style>
            @font-face { font-family: 'AR CENA'; src: url('FONT/ARCENA.ttf') format('truetype'); }
            body { background-color: #121212; color: white; font-family: "AR CENA", Arial, sans-serif; text-align: center; margin: 0; padding: 15px; }
            .settore-verde { border: 3px solid #00ff88; background: #0a0a0a; padding: 30px; border-radius: 15px; margin-bottom: 40px; }
            h2 { font-size: 48px; color: #00ff88; text-decoration: underline; margin-bottom: 25px; }
            .gold-select { color: gold; border: 2px solid gold; font-size: 22px; padding: 15px; background: #1a1a1a; cursor: pointer; font-family: "AR CENA", sans-serif; }
            .img-container { max-width: 90%; max-height: 70vh; border: 3px solid gold; border-radius: 10px; margin-top: 20px; display: none; object-fit: contain; }
            .flex-top { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        </style>
    </head>
    <body>
        <div class="settore-verde">
            <h1 style="color: #00ff88; font-size: 64px; text-shadow: 4px 4px #004422; margin-bottom: 30px;">🏆 16° Torneo Pronostici 🏆 2025/26</h1>
            <select class="gold-select" onchange="var img=document.getElementById('img-albo'); img.src=this.value + '?t=' + new Date().getTime(); img.style.display='inline-block'">
                <option value="">-- 📜 ALBO D'ORO --</option>
                <option value="immagini_fisse/ALBOTORNEO.png">ALBO TORNEO</option>
                <option value="immagini_fisse/ALBOAPERTURA.png">ALBO APERTURA</option>
                <option value="immagini_fisse/ALBOCHIUSURA.png">ALBO CHIUSURA</option>
            </select><br><img id="img-albo" class="img-container">
            <div style="margin-top:20px;">
                <select class="gold-select" onchange="if(this.value) { window.open(this.value, '_blank'); this.selectedIndex=0; }">
                    <option value="">-- 📜 REGOLAMENTI --</option>
                    <option value="view_REGOLAMENTO_pronostici.html">REGOLAMENTO PRONOSTICI</option>
                    <option value="view_REGOLAMENTO_Extra.html">REGOLAMENTO EXTRA</option>
                </select>
            </div>
        </div>
        
        <div class="settore-verde">
            <h2>⚽ I RISULTATI ⚽</h2>
            <div class="flex-top"><img src="foto_tabellini/risultati_partite.png?v=1783103430" style="width:100%; max-width:850px; border:2px solid #00ff88;"><img src="foto_tabellini/foto_extra.png?v=1783103430" style="width:100%; max-width:450px; border:1px solid #444;"></div>
        </div>
        <div class="settore-verde">
            <h2>📊 LE CLASSIFICHE 📊</h2>
            <img src="foto_tabellini/classifica_turno.png?v=1783103430" style="width:95%; max-width:1200px; border:2px solid #00ff88;">
        </div>
        <div class="settore-verde">
            <h2>📝 I TABELLINI 📝</h2>
            <select class="gold-select" onchange="var img=document.getElementById('f-tab'); img.src=this.value + '?t=' + new Date().getTime(); img.style.display='inline-block'">
                <option value="">-- SELEZIONA GIOCATORE --</option>
                <option value="foto_tabellini/I PRONOSTICI DI TUTTI.png">I PRONOSTICI DI TUTTI</option>
            </select><br><img id="f-tab" style="display:none; width:90%; border:2px solid #00ff88; margin-top:25px; border-radius:12px;">
        </div>

        <div style="border: 3px solid gold; background: #0a0a0a; padding: 30px; border-radius: 15px;">
            <h1 style="color: gold; font-size: 52px; font-family: 'AR CENA';">🏆 2° Coppa SHECTOR 🏆</h1>
            <div style="background: #1a1a00; padding: 25px; border-radius: 15px; border: 1px solid gold; margin-bottom: 40px;">
                <img src="immagini_fisse/Primafoto.png" style="width: 100%; max-width: 600px; border: 2px solid gold; display: block; margin: auto;">
            </div>
            <div style="background: #1a1a00; padding: 25px; border-radius: 15px; border: 1px solid gold; margin-bottom: 40px;">
                <img src="immagini_fisse/2afase.png" style="width: 100%; max-width: 600px; display: block; margin: auto;">
            </div>
            <div style="background: #1a1a00; padding: 25px; border-radius: 15px; border: 1px solid gold;">
                <img src="immagini_fisse/3afase.png" style="width: 100%; max-width: 600px; border-radius: 5px; display: block; margin: auto;">
            </div>
        </div>
        <p style="color:#00ff88; margin-top:20px;">Ultimo aggiornamento: 03/07/2026 20:30:30</p>
    </body>
    </html>
