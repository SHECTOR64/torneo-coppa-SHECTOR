                    justify-content: center;

                #winner-content img {

                    border-radius: 6px;

                    letter-spacing: 0.5px;

                        max-width: 100% !important; /* Rimuove il blocco PC e sblocca la larghezza totale */
                        width: 100% !important;

                    #winner-content {

                        border-radius: 6px;
                        padding: 2px;

                    #winner-content img {
                        max-height: none !important; /* Rimuove il limite di altezza del PC */
